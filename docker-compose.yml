version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medibook_postgres
    restart: always
    environment:
      POSTGRES_USER: medibook
      POSTGRES_PASSWORD: medibook_password_secure
      POSTGRES_DB: medibook_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: medibook_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
