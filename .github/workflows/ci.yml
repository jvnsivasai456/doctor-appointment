name: Backend CI & Concurrency Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Backend Test Suite & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Setup Environment Variables
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Verify Prisma Client & Database
        run: |
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Run Backend Concurrency & Mutex Tests
        run: npm run test:concurrency

      - name: Verify Production Next.js Build
        run: npm run build
